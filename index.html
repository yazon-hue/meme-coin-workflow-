<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Launch Workflow</title>
<style>
  :root{
    --bg:#f4f3ef; --grid:#e4e2dc; --ink:#1d1d1b; --quiet:#6b6a64; --card:#ffffff; --line:#d7d4cc;
    --c1:#f6a27c; --c2:#7fd1b0; --c3:#93a6c4; --c4:#eb9cbf; --c5:#8cc98a; --c6:#a99be0; --c7:#ef8f8f; --c8:#7fb2ea; --c9:#f2cf63;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px; display:flex; flex-direction:column;
  }
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(4px);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  header .coin{display:flex;align-items:center;gap:8px;margin-left:auto}
  header label{font-size:12px;color:var(--quiet)}
  input,textarea,select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}
  button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:#fff;cursor:pointer;color:var(--ink)}
  button:hover{border-color:#aaa}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .progress{height:4px;background:var(--line)}
  .progress div{height:100%;background:var(--ink);width:0;transition:width .25s}
  nav.steps{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;scrollbar-width:thin}
  nav.steps button{white-space:nowrap;font-size:12px;padding:5px 10px;border-radius:999px}
  nav.steps button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav.steps button.done::after{content:" ✓"}
  main{flex:1;overflow:auto;padding:12px 20px 96px}
  .slide{max-width:1040px;margin:0 auto}
  .board{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
  .head{border-radius:8px;padding:18px;border:2px solid rgba(0,0,0,.15);box-shadow:0 2px 0 rgba(0,0,0,.06);position:sticky;top:0}
  .head .num{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.7}
  .head h2{margin:6px 0 4px;font-size:24px;line-height:1.15}
  .head .sub{font-size:13px}
  .head .time{margin-top:12px;font-size:12px;font-weight:600;background:rgba(255,255,255,.55);display:inline-block;padding:3px 8px;border-radius:999px}
  .intro{font-size:15px;line-height:1.5;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .note{position:relative;border-radius:6px;padding:14px 14px 14px 40px;min-height:92px;font-size:14px;line-height:1.4;cursor:pointer;border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 0 rgba(0,0,0,.06);transition:opacity .15s,transform .1s;user-select:none}
  .note:hover{transform:translateY(-1px)}
  .note b{display:block;margin-bottom:3px}
  .note .tick{position:absolute;left:12px;top:14px;width:18px;height:18px;border-radius:4px;border:2px solid rgba(0,0,0,.35);background:rgba(255,255,255,.7)}
  .note.done{opacity:.45}
  .note.done .tick{background:var(--ink);border-color:var(--ink)}
  .note.done .tick::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .note.warnnote{cursor:default;background:#fde8e6;border:2px solid #d9534f;padding-left:40px}
  .note.warnnote:hover{transform:none}
  .note.warnnote .x{position:absolute;left:12px;top:12px;width:20px;height:20px;border-radius:50%;background:#c62828;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .head.warn{background:#c62828 !important;color:#fff;border-color:#8e1b1b}
  .head.warn .time{color:var(--ink)}
  .switch{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink)}
  .switch.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .note.dashed{border:2px dashed rgba(0,0,0,.3)}
  .note .tag{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.65);border-radius:4px;padding:1px 6px;margin-top:6px}
  .panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--quiet)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--quiet);font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
  .field label{font-size:12px;color:var(--quiet)}
  .score{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .score input[type=range]{width:100%}
  .total{font-size:20px;font-weight:700;margin-top:10px}
  .go{color:#1b7f46}.nogo{color:#b3261e}
  .tpl{background:#faf9f6;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;margin:6px 0 4px}
  .rules li{margin:8px 0;font-size:15px;line-height:1.45}
  .small{font-size:12px;color:var(--quiet);line-height:1.5}
  a{color:#1f5fbf}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:rgba(255,255,255,.92);border-top:1px solid var(--line)}
  footer .count{font-size:13px;color:var(--quiet)}
  @media (max-width:760px){
    .board{grid-template-columns:1fr}
    .head{position:static}
    header .coin{margin-left:0;width:100%}
    header .coin select{flex:1}
  }
</style>
</head>
<body>
<header>
  <h1>Meme Launch Workflow</h1>
  <a class="switch on" href="index.html">Meme workflow</a><a class="switch " href="tech.html">Tech workflow</a>
  <div class="coin">
    <label for="coinSel">Working on</label>
    <select id="coinSel"></select>
    <button id="newCoin">+ New coin</button>
    <button id="resetCoin" title="Untick every note for this coin">Reset ticks</button>
  </div>
</header>
<div class="progress"><div id="bar"></div></div>
<nav class="steps" id="steps"></nav>
<main><div class="slide" id="slide"></div></main>
<footer>
  <button id="prev">← Back</button>
  <span class="count" id="count"></span>
  <button id="next" class="primary">Next →</button>
</footer>

<script>
const SLIDES = [
  { key:"type", num:"Step 0", title:"Pick the type", sub:"Sets the time budget and asset list", color:"--c1", time:"2 min",
    intro:"Decide the type first. Chain is always Solana.",
    notes:[
      ["Tweet coin","A large account posts a phrase, image or animal that could catch on.","15 to 30 min"],
      ["Narrative meme","A meme, culture moment or trend gaining speed.","2 to 3 hours"],
      ["Solana","Skip Base and Robinhood Chain."]
    ],
    extra:`<div class="panel"><h3>Kill it if</h3><table>
      <tr><th>Type</th><th>Needs</th><th>Kill it if</th></tr>
      <tr><td>Tweet coin</td><td>Logo, 1 banner, X account, 1 image</td><td>10+ copies already live, or the top copy has already run hard</td></tr>
      <tr><td>Narrative meme</td><td>Logo, banners, 2 images, X account, optional one-pager</td><td>The narrative peaked yesterday, or you can't beat the existing art</td></tr>
    </table></div>`
  },
  { key:"scan", num:"Step 1", title:"Scan", sub:"Find 3 to 5 candidates", color:"--c2", time:"30 to 45 min, daily",
    intro:"Note each candidate's trigger, type and a one-line \"why now\".",
    notes:[
      ["X list of big accounts","30 to 50 accounts and narrative-setters."],
      ["pump.fun trending","What's moving right now."],
      ["DEX Screener trending","What's holding above bonding."]
    ],
    links:[["pump.fun","https://pump.fun"],["DEX Screener (Solana)","https://dexscreener.com/solana"]]
  },
  { key:"research", num:"Step 2", title:"Research", sub:"Go / no-go. Never skip it.", color:"--c3", time:"10 to 30 min",
    intro:"The question: has it been done already, and how did it go?",
    notes:[
      ["Done before?","Search the name, ticker and key phrase on pump.fun and DEX Screener. Count live copies."],
      ["How far did the best copy get?","Check its peak market cap and whether it's still alive."],
      ["Search X for shilled copies","The phrase plus \"CA\" or \"$\"."],
      ["Log the decision","Write go or no-go and why, even for skips."]
    ],
    score:true
  },
  { key:"identity", num:"Step 3", title:"Identity", sub:"Name, story, voice", color:"--c4", time:"10 min",
    intro:"Short, typeable, not already in heavy use. If you can't write the story in one line, skip the coin.",
    notes:[
      ["Name + ticker","Check the ticker isn't crowded on pump.fun."],
      ["One-line story","Why it's funny right now."],
      ["Tone in three words","How the X account talks."]
    ],
    identity:true
  },
  { key:"assets", num:"Step 4", title:"Assets", sub:"From your templates", color:"--c6", time:"10 min to 2 hours",
    intro:"Check every asset reads at thumbnail size on a phone.",
    notes:[
      ["Logo","1000 × 1000 px square PNG."],
      ["Banners 3:1","X banner 1500 × 500, DEX header 600 × 200."],
      ["X profile picture","400 × 400 (reuse the logo)."],
      ["1 to 2 post images","1200 × 675 and 1080 × 1080."]
    ],
    extra:`<div class="panel"><h3>Asset spec</h3><table>
      <tr><th>Asset</th><th>Size</th><th>Used on</th></tr>
      <tr><td>Logo</td><td>1000 × 1000 px PNG</td><td>pump.fun, DEX Screener icon (1:1, min 100 px)</td></tr>
      <tr><td>DEX Screener header</td><td>3:1, 600 × 200 px</td><td>DEX Screener pair page</td></tr>
      <tr><td>X profile picture</td><td>400 × 400 px</td><td>X</td></tr>
      <tr><td>X banner</td><td>1500 × 500 px</td><td>X (can double as DEX header)</td></tr>
      <tr><td>Post images</td><td>1200 × 675 / 1080 × 1080</td><td>Launch post and follow-ups</td></tr>
    </table></div>`
  },
  { key:"socials", num:"Step 5", title:"Socials", sub:"Before launch", color:"--c7", time:"20 to 40 min",
    intro:"The account shouldn't be empty when the CA goes out.",
    notes:[
      ["New X account","Handle, picture, banner, bio."],
      ["\"Not affiliated\" line","Tweet coins: in the X bio and coin description."],
      ["2 to 4 posts","The meme, the story, a teaser."],
      ["Telegram (optional)","Only if you'll actually run it."]
    ],
    templates:true
  },
  { key:"launch", num:"Step 6", title:"Launch", sub:"On proxima", color:"--c8", time:"10 min",
    intro:"Decide these before you click create. Two of them can't be changed later.",
    notes:[
      ["Create the coin","Name, ticker, logo, description, X link."],
      ["Creator fee or cashback","Chosen at launch and can't be undone."],
      ["Fee redirect","Creator fees can be redirected to another wallet only once per token."],
      ["Preset dev buy","From the dev wallet only. Note the size in the log."],
      ["Post CA on X and pin it","With the hero image."]
    ],
    links:[["Create on proxima","https://app.proxima.tools"]]
  },
  { key:"after", num:"Step 7", title:"First 2 hours", sub:"Traction and exit", color:"--c2", time:"2 hours",
    intro:"Follow the exit plan you set before launch. Don't post anything that contradicts what you're doing with your bag.",
    notes:[
      ["DEX Screener info","Logo, header, socials once the token shows up. Enhanced Token Info is paid (currently $299): only when it has traction."],
      ["Post 3 to 5 times","Memes and holder milestones."],
      ["Reply to real people","Not bots, not yourself."],
      ["Exit plan","When you take profit, and how much."]
    ],
    links:[["DEX Screener Enhanced Token Info","https://marketplace.dexscreener.com/product/token-info"]]
  },
  { key:"close", num:"Step 8", title:"Close out", sub:"Same day", color:"--c3", time:"10 min",
    intro:"Log every coin, including the losers. After 15 to 20 launches the log tells you which type makes you money.",
    notes:[
      ["Log the row","Peak market cap, profit, hours, what worked."],
      ["Keep running or stop","If you stop, don't delete: leave a final post."]
    ],
    log:true
  },
  { key:"review", num:"Weekly", title:"Sunday review", sub:"Improve the process", color:"--c9", time:"20 min",
    intro:"Answer these five every Sunday, using the launch log.",
    notes:[
      ["Best profit per hour?","Tweet coins or narrative memes this week?"],
      ["What did research miss?","Did any coin that scored 14+ flop? Why?"],
      ["Best content?","Which asset or post got the most engagement?"],
      ["Inside the budget cap?","Yes or no, and by how much."],
      ["One change","One tweak to this workflow for next week."]
    ]
  },
  { key:"setup", num:"Once", title:"One-time setup", sub:"Do before launch #1", color:"--c5",
    intro:"Do this once so each launch is just filling in blanks.",
    notes:[
      ["Wallets","A treasury wallet for the budget; a dev wallet funded from it per launch. Personal funds separate."],
      ["Budget cap","Fixed SOL per launch and a weekly cap."],
      ["Accounts","Launch platform, DEX Screener, email for new X accounts."],
      ["Asset templates","Canva or Figma: logo, DEX header, X banner, post images."],
      ["Copy templates","Bio, launch tweet, coin description (built into the Socials slide)."],
      ["Scan list","An X list of 30 to 50 accounts, plus trending pages bookmarked."],
      ["Fee defaults","Per type: keep creator fees or cashback, decided once."]
    ]
  }
];

/* ---------- storage (fails quietly) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let state = store.get("mlw-state", { coins:["My first coin"], current:"My first coin", data:{}, log:[], slide:0 });
const save = () => store.set("mlw-state", state);
const coinData = () => (state.data[state.current] ||= { ticks:{}, score:{}, id:{} });

/* ---------- coin picker ---------- */
const sel = document.getElementById("coinSel");
function renderCoins(){
  sel.innerHTML = state.coins.map(c => `<option${c===state.current?" selected":""}>${esc(c)}</option>`).join("");
}
sel.onchange = () => { state.current = sel.value; save(); render(); };
document.getElementById("newCoin").onclick = () => {
  const n = prompt("Name for this launch (you can change the real name on the Identity slide):");
  if(!n) return;
  if(!state.coins.includes(n)) state.coins.unshift(n);
  state.current = n; state.slide = 0; save(); renderCoins(); render();
};
document.getElementById("resetCoin").onclick = () => {
  if(confirm(`Untick every note for "${state.current}"?`)){ coinData().ticks = {}; save(); render(); }
};

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function slideDone(i){
  const s = SLIDES[i], t = coinData().ticks;
  return !s.warn && s.notes.length && s.notes.every((_, j) => t[`${s.key}.${j}`]);
}

/* ---------- render ---------- */
const el = document.getElementById("slide");
function render(){
  const i = state.slide, s = SLIDES[i], d = coinData();
  document.getElementById("bar").style.width = `${(i/(SLIDES.length-1))*100}%`;
  document.getElementById("count").textContent = `${i+1} / ${SLIDES.length} · ${s.title}`;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").textContent = i === SLIDES.length-1 ? "Back to start ↺" : `Next: ${SLIDES[i+1].title} →`;
  document.getElementById("steps").innerHTML = SLIDES.map((x, j) =>
    `<button class="${j===i?"active":""} ${slideDone(j)?"done":""}" data-go="${j}">${esc(x.num)} · ${esc(x.title)}</button>`).join("");

  const notes = s.warn ? s.notes.map(n => `<div class="note warnnote"><span class="x">✕</span><b>${esc(n[0])}</b>${esc(n[1]||"")}</div>`).join("") : s.notes.map((n, j) => {
    const k = `${s.key}.${j}`, tech = n[2] === "tech";
    const tag = tech ? `<span class="tag">tech only</span>` : (n[2] ? `<span class="tag">${esc(n[2])}</span>` : "");
    return `<div class="note ${d.ticks[k]?"done":""} ${(s.dashed||tech)?"dashed":""}" data-k="${k}" style="background:color-mix(in srgb, var(${s.color}) 32%, #fff)">
      <span class="tick"></span><b>${esc(n[0])}</b>${esc(n[1]||"")}${tag?"<br>"+tag:""}</div>`;
  }).join("");

  let extra = s.extra || "";
  if(s.links) extra += `<div class="panel"><h3>Links</h3>${s.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" · ")}</div>`;
  if(s.score) extra += scorePanel(d);
  if(s.identity) extra += identityPanel(d);
  if(s.templates) extra += templatePanel(d);
  if(s.log) extra += logPanel(d);

  el.innerHTML = `<div class="board">
    <div class="head ${s.warn?"warn":""}" style="background:var(${s.color||"--c7"})${s.dashed?";border-style:dashed":""}">
      <div class="num">${esc(s.num)}</div><h2>${esc(s.title)}</h2><div class="sub">${esc(s.sub)}</div>
      ${s.time?`<div class="time">⏱ ${esc(s.time)}</div>`:""}
    </div>
    <div><p class="intro">${esc(s.intro)}</p><div class="notes">${notes}</div>${extra}</div>
  </div>`;
  wire(s, d);
  main.scrollTop = 0;
}
const main = document.querySelector("main");

function scorePanel(d){
  const crit = [["timing","Timing"],["orig","Originality"],["art","Art potential"],["story","Story in one line"]];
  const sc = d.score;
  const total = crit.reduce((a,[k]) => a + (+sc[k]||1), 0);
  return `<div class="panel"><h3>Score it (1 to 5 each)</h3><div class="score">${crit.map(([k,l]) =>
    `<div class="field"><label>${l}: <b id="v-${k}">${sc[k]||1}</b></label><input type="range" min="1" max="5" value="${sc[k]||1}" data-score="${k}"></div>`).join("")}</div>
    <div class="total" id="total"></div></div>`;
}
function identityPanel(d){
  const f = [["name","Name"],["ticker","Ticker"],["story","One-line story"],["tone","Tone (3 words)"],["handle","X handle"],["site","Website"],["ca","Contract address (after launch)"],["poster","Original poster @ (tweet coins)"]];
  return `<div class="panel"><h3>This coin</h3><div class="row">${f.map(([k,l]) =>
    `<div class="field"><label>${l}</label><input data-id="${k}" value="${esc(d.id[k]||"")}"></div>`).join("")}</div>
    <p class="small">Saved in this browser and used to fill the copy templates on the Socials slide.</p></div>`;
}
function templatePanel(d){
  const v = d.id, n = v.name||"[NAME]", t = (v.ticker||"[TICKER]").replace(/^\$/,""), st = v.story||"[ONE-LINE STORY]",
        site = v.site||"[WEBSITE]", ca = v.ca||"[CA]", p = v.poster ? v.poster.replace(/^@?/,"@") : "@[poster]";
  const tpls = [
    ["X bio", `${n} ($${t}) · ${st}\n${site}`],
    ["X bio, tweet coin", `${n} ($${t}) · ${st}\nNot affiliated with ${p}.`],
    ["Launch post", `$${t} is live.\n\n${st}\n\nCA: ${ca}`],
    ["pump.fun description", `${st}${v.poster ? `\n\nNot affiliated with ${p}.` : ""}`]
  ];
  return `<div class="panel"><h3>Copy templates</h3>${tpls.map(([l,x],j) =>
    `<div><div class="row" style="justify-content:space-between"><b style="font-size:13px">${l}</b><button data-copy="${j}">Copy</button></div><div class="tpl" id="tpl-${j}">${esc(x)}</div></div>`).join("")}
    <p class="small">Fill the fields on the Identity slide and these update.</p></div>`;
}
function logPanel(d){
  const rows = state.log.map((r,j) => `<tr>${["date","coin","type","score","dev","peak","pnl","hours","note"].map(k=>`<td>${esc(r[k]||"")}</td>`).join("")}<td><button data-del="${j}">✕</button></td></tr>`).join("");
  const sc = d.score, score = ["timing","orig","art","story"].reduce((a,k)=>a+(+sc[k]||1),0);
  return `<div class="panel"><h3>Launch log</h3>
    <div class="row">
      <div class="field"><label>Type</label><select id="l-type"><option>Tweet coin</option><option>Narrative meme</option><option>Skipped</option></select></div>
      <div class="field"><label>Dev buy (SOL)</label><input id="l-dev"></div>
      <div class="field"><label>Peak MC</label><input id="l-peak"></div>
      <div class="field"><label>Profit (SOL)</label><input id="l-pnl"></div>
      <div class="field"><label>Hours</label><input id="l-hours"></div>
      <div class="field" style="flex:2"><label>Note</label><input id="l-note"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="primary" id="l-add">Add "${esc(d.id.name||state.current)}" to log (score ${score}/20)</button><button id="l-csv">Download CSV</button></div>
    <div style="overflow-x:auto;margin-top:12px"><table><tr><th>Date</th><th>Coin</th><th>Type</th><th>Score</th><th>Dev buy</th><th>Peak MC</th><th>Profit</th><th>Hours</th><th>Note</th><th></th></tr>${rows || `<tr><td colspan="10" class="small">No launches logged yet.</td></tr>`}</table></div>
    <p class="small">The log lives in this browser. Download the CSV now and then as a backup.</p></div>`;
}

function updateTotal(d){
  const t = ["timing","orig","art","story"].reduce((a,k)=>a+(+d.score[k]||1),0), e = document.getElementById("total");
  if(e) e.innerHTML = `${t} / 20 · <span class="${t>=14?"go":"nogo"}">${t>=14?"GO":"NO-GO (needs 14+)"}</span>`;
}

function wire(s, d){
  el.querySelectorAll(".note").forEach(n => n.onclick = () => {
    const k = n.dataset.k; d.ticks[k] = !d.ticks[k]; save(); n.classList.toggle("done", !!d.ticks[k]);
    document.querySelectorAll("#steps button")[state.slide].classList.toggle("done", slideDone(state.slide));
  });
  el.querySelectorAll("[data-score]").forEach(r => r.oninput = () => {
    d.score[r.dataset.score] = +r.value; document.getElementById("v-"+r.dataset.score).textContent = r.value; save(); updateTotal(d);
  });
  if(s.score) updateTotal(d);
  el.querySelectorAll("[data-id]").forEach(i => i.oninput = () => { d.id[i.dataset.id] = i.value; save(); });
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const txt = document.getElementById("tpl-"+b.dataset.copy).textContent;
    try{ await navigator.clipboard.writeText(txt); b.textContent = "Copied"; }catch(e){ b.textContent = "Select + copy"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  });
  const add = document.getElementById("l-add");
  if(add) add.onclick = () => {
    const g = id => document.getElementById(id).value;
    state.log.unshift({ date:new Date().toISOString().slice(0,10), coin:(d.id.name||state.current)+(d.id.ticker?` ($${d.id.ticker.replace(/^\$/,"")})`:""),
      type:g("l-type"), score:["timing","orig","art","story"].reduce((a,k)=>a+(+d.score[k]||1),0), dev:g("l-dev"), peak:g("l-peak"), pnl:g("l-pnl"), hours:g("l-hours"), note:g("l-note") });
    save(); render();
  };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if(confirm("Remove this log row?")){ state.log.splice(+b.dataset.del,1); save(); render(); }
  });
  const csv = document.getElementById("l-csv");
  if(csv) csv.onclick = () => {
    const keys = ["date","coin","type","score","dev","peak","pnl","hours","note"];
    const out = [keys.join(",")].concat(state.log.map(r => keys.map(k => `"${String(r[k]||"").replace(/"/g,'""')}"`).join(","))).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out],{type:"text/csv"})); a.download = "launch-log.csv"; a.click();
  };
}

/* ---------- navigation ---------- */
function go(i){ state.slide = Math.max(0, Math.min(SLIDES.length-1, i)); save(); render(); }
document.getElementById("prev").onclick = () => go(state.slide-1);
document.getElementById("next").onclick = () => go(state.slide === SLIDES.length-1 ? 0 : state.slide+1);
document.getElementById("steps").onclick = e => { const b = e.target.closest("[data-go]"); if(b) go(+b.dataset.go); };
document.addEventListener("keydown", e => {
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  if(e.key === "ArrowRight") go(state.slide+1);
  if(e.key === "ArrowLeft") go(state.slide-1);
});

if(!state.coins.includes(state.current)) state.current = state.coins[0];
renderCoins(); render();
</script>
</body>
</html>
